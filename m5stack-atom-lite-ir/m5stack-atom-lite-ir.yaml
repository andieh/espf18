# Atom Lite - IR remote control for JBL Bar 5.0 (basement living room)
# Transmitter: GPIO26 (Grove) - IR unit for now, later SFH415 with BC547
#              Alternative: built-in IR LED -> change ir_tx_pin to GPIO12
# Receiver:    GPIO32 (Grove, IR unit) - stays in place for later learning
# Codes: Pronto raw data from the learning log, each with main signal + repeat

substitutions:
  ir_tx_pin: GPIO26   # IR unit / later SFH415; built-in LED: GPIO12
  ir_rx_pin: GPIO32
  pronto_repeat: "0000 006D 0002 0000 0159 0056 0015 0181"

esphome:
  name: m5stack-atom-lite
  name_add_mac_suffix: true   # results in m5stack-atom-lite-xxxxxx
  friendly_name: Soundbar IR

esp32:
  board: m5stack-atom

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid            # bane_iot
  password: !secret wifi_password
  # no static IP - comes via the DHCP reservation (10.0.80.42)

remote_transmitter:
  pin: ${ir_tx_pin}
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: ${ir_rx_pin}
    inverted: true
    mode:
      input: true
      pullup: true
  dump: nec   # also shows our own transmitted signal, in case it gets reflected back

button:
  - platform: template
    name: "Power"
    icon: mdi:power
    on_press:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0022 0000 0159 00AC 0015 0015 0015 0015 0015 0040 0015 0015 0015 0015 0015 0015 0015 0015 0015 0040 0015 0015 0015 0015 0015 0040 0015 0015 0015 0040 0015 0040 0015 0040 0015 0015 0015 0040 0015 0040 0015 0040 0015 0040 0015 0040 0015 0040 0015 0040 0015 0040 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0181"
      - remote_transmitter.transmit_pronto:
          data: ${pronto_repeat}

