# Atom Lite – IR-Fernbedienung für JBL Bar 5.0 (Wohnzimmer KG)
# Sender:    GPIO26 (Grove) – IR Unit jetzt, später SFH415 mit BC547
#            Alternative: eingebaute IR-Diode → ir_tx_pin auf GPIO12 ändern
# Empfänger: GPIO32 (Grove, IR Unit) – bleibt drin zum späteren Anlernen
# Codes: Pronto-Rohdaten aus dem Anlern-Log, jeweils Hauptsignal + Wiederholung

substitutions:
  ir_tx_pin: GPIO26   # IR Unit / später SFH415; eingebaute Diode: GPIO12
  ir_rx_pin: GPIO32
  pronto_repeat: "0000 006D 0002 0000 0159 0056 0015 0181"

esphome:
  name: m5stack-atom-lite
  name_add_mac_suffix: true   # ergibt m5stack-atom-lite-xxxxxx
  friendly_name: Soundbar IR

esp32:
  board: m5stack-atom

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid            # bane_iot
  password: !secret wifi_password
  # keine feste IP – kommt über die DHCP-Reservierung (10.0.80.42)

remote_transmitter:
  pin: ${ir_tx_pin}
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: ${ir_rx_pin}
    inverted: true
    mode:
      input: true
      pullup: true
  dump: nec   # zeigt auch das eigene Sendesignal, falls es zurückgestreut wird

button:
  - platform: template
    name: "Power"
    icon: mdi:power
    on_press:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0022 0000 0159 00AC 0015 0015 0015 0015 0015 0040 0015 0015 0015 0015 0015 0015 0015 0015 0015 0040 0015 0015 0015 0015 0015 0040 0015 0015 0015 0040 0015 0040 0015 0040 0015 0015 0015 0040 0015 0040 0015 0040 0015 0040 0015 0040 0015 0040 0015 0040 0015 0040 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0181"
      - remote_transmitter.transmit_pronto:
          data: ${pronto_repeat}

