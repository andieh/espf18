# Atom Lite + M5Stack IR Unit (Grove) – ANLERN-VERSION
# Schreibt alle empfangenen IR-Codes ins Log.
# IR Unit an der Grove-Buchse: GPIO32 = Empfänger, GPIO26 = Sender
# Eingebaute IR-Diode des Atom Lite: GPIO12

esphome:
  name: m5stack-atom-lite
  name_add_mac_suffix: true   # ergibt m5stack-atom-lite-xxxxxx

esp32:
  board: m5stack-atom

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid        # bane_iot
  password: !secret wifi_password
  # keine feste IP – kommt über die DHCP-Reservierung (10.0.80.42)

# IR-Empfänger der IR Unit: gibt jeden erkannten Code im Log aus
remote_receiver:
  pin:
    number: GPIO32
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all
