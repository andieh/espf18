esphome:
  #name: room-climate-bathroom             # later e.g. climate-bedroom (only a-z, 0-9, -)
  #friendly_name: Room Climate Bathroom    # display name in Home Assistant
  name: room-climate-1 # generic, moveable
  friendly_name: Room Climate 1

esp32:
  # esp32-c3 super mini
  #board: esp32-c3-devkitm-1
  #variant: esp32c3
  #framework:
  #  type: esp-idf
 
  # esp32
  board: esp32dev
  framework:
    type: esp-idf

logger:
  #hardware_uart: USB_SERIAL_JTAG   # logs via the USB-C port (not the TX/RX pins)

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #output_power: 8.5dB        # known fix for weak/unstable WiFi on the C3 Super Mini

i2c:
  # super mini:
  #sda: GPIO4
  #scl: GPIO3
  # esp32
  sda: GPIO21
  scl: GPIO22
  scan: true                 # logs whether the sensor is found (0x44)

sensor:
  - platform: sht4x
    address: 0x44
    update_interval: 60s
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Laufzeit"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
    ssid:
      name: "SSID"

button:
  - platform: restart
    name: "Neustart"

