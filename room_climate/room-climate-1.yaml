esphome:
  name: room-climate-1
  friendly_name: Room Climate 1

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true                 # logs whether the sensor is found (0x44)

sensor:
  - platform: sht4x
    address: 0x44
    update_interval: 60s
    temperature:
      name: "Temperature"
      filters:
        - offset: -0.6
    humidity:
      name: "Humidity"
      filters:
        - offset: 2.0

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Laufzeit"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
    ssid:
      name: "SSID"

button:
  - platform: restart
    name: "Neustart"

