# Board: M5Stack ATOM Lite (M5Stack)
# Definition: definitions/boards/m5stack-atom-lite/manifest.yaml

esphome:
  name: bluetooth-proxy
  friendly_name: Bluetooth-Proxy

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

# Future updates via OTA, no USB cable needed anymore
ota:
  - platform: esphome
    password: !secret ota_password

# Wi-Fi credentials live in secrets.yaml, not directly here
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: Bluetooth-Proxy Fallback Hotspot
    password: !secret ota_password

captive_portal:

bluetooth_proxy:

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 30s
  - platform: uptime
    name: "Laufzeit"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
    ssid:
      name: "SSID"

