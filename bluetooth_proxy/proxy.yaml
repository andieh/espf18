# Board: M5Stack ATOM Lite (M5Stack)
# Definition: definitions/boards/m5stack-atom-lite/manifest.yaml

esphome:
  name: bluetooth-proxy
  friendly_name: Bluetooth-Proxy

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

# Updates künftig per OTA möglich, kein USB-Kabel mehr nötig
ota:
  - platform: esphome
    password: !secret ota_password

# WLAN-Zugangsdaten liegen in secrets.yaml, nicht direkt hier
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: Bluetooth-Proxy Fallback Hotspot
    password: !secret ota_password

captive_portal:

bluetooth_proxy:

