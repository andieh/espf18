esphome:
  name: birb
  friendly_name: Birb

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  logs:
    servo: INFO

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB   # known fix for the weak Wi-Fi reception of the Super Minis

output:
  - platform: ledc
    id: servo_pwm
    pin: GPIO4
    frequency: 50 Hz

servo:
  - id: birb_servo
    output: servo_pwm
    restore: true          # restore position after restart
    auto_detach_time: 1s   # no humming while idle
    transition_length: 3s  # slow, "natural" tipping motion

number:
  - platform: template
    name: "Position"
    min_value: -100
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    set_action:
      - servo.write:
          id: birb_servo
          level: !lambda 'return x / 100.0;'
