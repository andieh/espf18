esphome:
  name: birb
  friendly_name: Birb

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB   # bekannter Fix für den schwachen WLAN-Empfang der Super Minis
  ap:
    ssid: "Birb Fallback"

captive_portal:

output:
  - platform: ledc
    id: servo_pwm
    pin: GPIO4
    frequency: 50 Hz

servo:
  - id: birb_servo
    output: servo_pwm
    restore: true          # Position nach Neustart wiederherstellen
    auto_detach_time: 1s   # kein Brummen im Stillstand
    transition_length: 1s  # langsames, „natürliches“ Umkippen

number:
  - platform: template
    name: "Position"
    min_value: -100
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    set_action:
      - servo.write:
          id: birb_servo
          level: !lambda 'return x / 100.0;'
