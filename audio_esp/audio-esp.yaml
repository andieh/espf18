esphome:
  name: audio-esp
  friendly_name: Audio Eingang

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf   # required for speaker/media_player components

# The YB-ESP32-S3-AMP (N8R2) has 2MB PSRAM in QUAD mode (not octal - that would only apply to -R8 variants)
psram:
  mode: quad

# Wi-Fi credentials live in secrets.yaml, not directly here
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:
  level: INFO
  hardware_uart: UART0   # via UART0 -> CH343 instead of the native USB port, which briefly drops on every reset

# API connection to Home Assistant, encrypted
api:
  encryption:
    key: !secret api_encryption_key

# Future updates via OTA, no USB cable needed anymore
ota:
  - platform: esphome
    password: !secret ota_password

# --- Audio ---
# On the YB-ESP32-S3-AMP, the I2S pins are hardwired to the two onboard MAX98357A
# (per the manufacturer, GPIO5/6/7 are reserved exclusively for this, not freely assignable)

i2s_audio:
  - id: i2s_out
    i2s_bclk_pin: GPIO5
    i2s_lrclk_pin: GPIO6

speaker:
  - platform: i2s_audio
    id: doorbell_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO7
    dac_type: external
    buffer_duration: 40ms

# Lightweight test tone without an audio decoder - generates a square wave directly
rtttl:
  speaker: doorbell_speaker
  id: buzzer
  gain: 80%

media_player:
  - platform: speaker
    name: "Türgong"
    id: doorbell_player
    buffer_size: 16000   # default would be 1,000,000 bytes - far too large without PSRAM; with PSRAM now in place, no longer really necessary to keep it this small
    announcement_pipeline:
      speaker: doorbell_speaker
      format: WAV

# --- Diagnostics (optional, can be removed later) ---

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 30s
  - platform: uptime
    name: "Laufzeit"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
    ssid:
      name: "SSID"

button:
  - platform: restart
    name: "Neustart"

  - platform: template
    name: "Testton abspielen"
    on_press:
      - rtttl.play: 'test:d=4,o=5,b=100:c,e,g,c6'
