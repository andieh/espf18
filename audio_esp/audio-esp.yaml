esphome:
  name: audio-esp
  friendly_name: Audio Eingang

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf   # wird für speaker/media_player Komponenten benötigt

# Das YB-ESP32-S3-AMP (N8R2) hat 2MB PSRAM im QUAD-Modus (nicht octal - das wäre nur bei -R8-Varianten der Fall)
psram:
  mode: quad

# WLAN-Zugangsdaten liegen in secrets.yaml, nicht direkt hier
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:
  level: INFO
  hardware_uart: UART0   # über UART0 -> CH343 statt über den nativen USB-Port, der bei jedem Reset kurz abreißt

# API-Verbindung zu Home Assistant, verschlüsselt
api:
  encryption:
    key: !secret api_encryption_key

# Updates künftig per OTA möglich, kein USB-Kabel mehr nötig
ota:
  - platform: esphome
    password: !secret ota_password

# --- Audio ---
# Auf dem YB-ESP32-S3-AMP sind die I2S-Pins zu den beiden onboard MAX98357A fest verdrahtet
# (GPIO5/6/7 sind laut Hersteller ausschließlich dafür reserviert, nicht frei belegbar)

i2s_audio:
  - id: i2s_out
    i2s_bclk_pin: GPIO5
    i2s_lrclk_pin: GPIO6

speaker:
  - platform: i2s_audio
    id: doorbell_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO7
    dac_type: external
    buffer_duration: 40ms

# Leichtgewichtiger Testton ohne Audio-Decoder - erzeugt direkt eine Rechteckwelle
rtttl:
  speaker: doorbell_speaker
  id: buzzer
  gain: 80%

media_player:
  - platform: speaker
    name: "Türgong"
    id: doorbell_player
    buffer_size: 16000   # Standard wäre 1.000.000 Byte - viel zu groß ohne PSRAM, jetzt mit PSRAM eigentlich nicht mehr nötig so klein zu halten
    announcement_pipeline:
      speaker: doorbell_speaker
      format: WAV

# --- Diagnose (optional, kann später entfernt werden) ---

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s

  - platform: uptime
    name: "Laufzeit"

button:
  - platform: restart
    name: "Neustart"

  - platform: template
    name: "Testton abspielen"
    on_press:
      - rtttl.play: 'test:d=4,o=5,b=100:c,e,g,c6'
