esphome:
  name: tuergong
  friendly_name: Türgong

esp32:
  board: esp32dev
  framework:
    type: esp-idf   # required for speaker/media_player components

# Wi-Fi credentials live in secrets.yaml, not directly here
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:
  level: INFO

# API connection to Home Assistant, encrypted
api:
  encryption:
    key: !secret api_encryption_key

# Future updates via OTA, no USB cable needed anymore
ota:
  - platform: esphome
    password: !secret ota_password

# --- Audio ---

i2s_audio:
  - id: i2s_out
    i2s_bclk_pin: GPIO26
    i2s_lrclk_pin: GPIO25

speaker:
  - platform: i2s_audio
    id: doorbell_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO22
    dac_type: external
    buffer_duration: 40ms

# Leichtgewichtiger Testton ohne Audio-Decoder - erzeugt direkt eine Rechteckwelle
rtttl:
  speaker: doorbell_speaker
  id: buzzer
  gain: 80%

media_player:
  - platform: speaker
    name: "Türgong"
    id: doorbell_player
    buffer_size: 16000   # default would be 1,000,000 bytes - far too large without PSRAM
    announcement_pipeline:
      speaker: doorbell_speaker
      format: WAV

# --- Diagnostics (optional, can be removed later) ---

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s

  - platform: uptime
    name: "Laufzeit"

button:
  - platform: restart
    name: "Neustart"

  - platform: template
    name: "Testton abspielen"
    on_press:
      - rtttl.play: 'test:d=4,o=5,b=100:c,e,g,c6'
