esphome:
  name: doorcam
  friendly_name: Door Cam

esp32:
  board: esp32dev
  framework:
    type: arduino

psram:
  mode: quad
  speed: 40MHz

logger:
    
# API-Verbindung zu Home Assistant, verschlüsselt
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "TTGO-Camera Fallback"
    password: "changeme123"

binary_sensor:
  - platform: gpio
    pin: 33
    name: Door Cam PIR
    id: pir_sensor
    device_class: motion
    on_press:
      - lambda: |-
          id(oled_display).turn_on();
    on_release:
      - delay: 30s
      - if:
          condition:
            binary_sensor.is_off: pir_sensor
          then:
            - lambda: |-
                id(oled_display).turn_off();

  - platform: gpio
    pin:
      number: 34
      #mode: INPUT_PULLUP
      inverted: True
    name: Door Cam Button
    on_press:
      - logger.log: "The physical button was pressed!"
    filters:
      - delayed_off: 50ms

# fallback AP, brauchen wir erst mal nicht
#captive_portal:

i2c:
  - id: bus_a
    sda: 21
    scl: 22
    #scan: true
  - id: bus_b
    sda: 13
    scl: 12
    #scan: true

#i2c:
#  sda: GPIO21
#  scl: GPIO22

font:
  - file: "fonts/times-new-roman.ttf"
    id: tnr1
    size: 20
  - file: "fonts/times-new-roman.ttf"
    id: tnr2
    size: 24

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    i2c_id: bus_a
    address: 0x3C
    rotation: 180
    id: oled_display
    lambda: |-
       it.print(0, 0, id(tnr2), "Fam. Fuertig");
       it.print(64, 32, id(tnr1), TextAlign::CENTER, "Komm rin!");
#      if (id(pir_sensor).state) {
#        it.printf(64, 32, id(tnr1), TextAlign::CENTER, "Motion Detected!");
#      } else {
#        it.printf(64, 32, id(tnr1), TextAlign::CENTER, "No Motion");
#      }

# mal disablen
#esp32_camera_web_server:
