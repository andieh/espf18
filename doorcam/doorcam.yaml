esphome:
  name: doorcam
  friendly_name: Door Cam

esp32:
  board: esp32dev
  framework:
    type: arduino

psram:
  mode: quad
  speed: 40MHz

logger:
    
# API-Verbindung zu Home Assistant, verschlüsselt
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "TTGO-Camera Fallback"
    password: "changeme123"

binary_sensor:
  - platform: gpio
    pin: 33
    name: $friendly_name PIR
    id: pir_sensor
    device_class: motion
  - platform: gpio
    pin:
      number: 34
      #mode: INPUT_PULLUP
      inverted: True
    name: $friendly_name Button
    on_press:
      - logger.log: "The physical button was pressed!"
    filters:
      - delayed_off: 50ms


captive_portal:

i2c:
  - id: bus_a
    sda: 21
    scl: 22
    #scan: true
  - id: bus_b
    sda: 13
    scl: 12
    #scan: true

#i2c:
#  sda: GPIO21
#  scl: GPIO22

font:
  - file: "fonts/times-new-roman.ttf"
    id: tnr1
    size: 20
  - file: "fonts/times-new-roman.ttf"
    id: tnr2
    size: 24

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    i2c_id: bus_a
    address: 0x3C
    rotation: 180
    #
    lambda: |-
      it.print(0, 0, id(tnr1), "TTGO-Camera!");
      if (id(pir_sensor).state) {
        it.printf(64, 32, id(tnr1), TextAlign::CENTER, "Motion Detected!");
      } else {
        it.printf(64, 32, id(tnr1), TextAlign::CENTER, "No Motion");
      }

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot



esp32_camera:
  name: $friendly_name Camera
  external_clock:
    pin: 32
    frequency: 20MHz
  i2c_id: bus_b
  #n your ESPHome .yaml file, the data_pins list maps exactly as Y5, Y4, Y3, Y2, Y7, Y8, Y9, and Y6
  #data_pins: [15, 4, 14, 5, 23, 36, 39, 18]
  data_pins: [5, 14, 4, 15, 18, 23, 36, 39]
  vsync_pin: GPIO27
  href_pin: GPIO25
  pixel_clock_pin: GPIO19
  power_down_pin: GPIO26
  resolution: 640X480
  jpeg_quality: 10
  vertical_flip: true
  horizontal_mirror: false

